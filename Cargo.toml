[package]
name = "skillcache"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Alex-Caepio/skillcache"
description = "Standalone SkillCache compiler, sandbox gate runner, capsule registry, warm execution engine, and stdio MCP server"
publish = false

[[bin]]
name = "skillcache-engine"
path = "src/main.rs"

[[bin]]
name = "skillcache-program-fixture"
path = "tests/support/program_fixture.rs"
test = false
bench = false

[dependencies]
chrono = { version = "=0.4.45", features = ["clock"] }
fancy-regex = "0.14"
regex = "1"
rusqlite = { version = "=0.37.0", features = ["bundled", "modern_sqlite", "functions"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "=0.11.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "sync", "time"] }
unicode-casefold = "=0.2.0"
uuid = { version = "=1.22.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"
